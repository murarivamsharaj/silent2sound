spring.application.name=backend

# --- PostgreSQL datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/video_ai_db
spring.datasource.username=postgres
spring.datasource.password=murari
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Multipart upload limits ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# --- Custom storage location ---
app.storage.upload-dir=./uploads

# --- AI provider configuration ---
# provider options: mock, elevenlabs, replicate
app.ai.provider=mock
app.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
app.ai.vision.api-key=${OPENAI_API_KEY:}
